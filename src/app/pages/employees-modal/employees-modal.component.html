<h1 class="text-center text-dark-blue fs-heading1 my-4">Funcionário</h1>

<div class="border-top p-3">
  <form #editOrCreateForm="ngForm" (ngSubmit)="onSubmit(editOrCreateForm)">
    <div class="mb-3">
      <label for="name" class="fs-paragraph">Nome</label>
      <input
        type="text"
        class="form-control p-25 border-dark"
        id="name"
        name="nome"
        #nome="ngModel"
        placeholder="Digite o nome"
        ngModel="{{ employee.nome }}"
        required
      />
      <div *ngIf="nome.errors && (nome.dirty || nome.touched)" class="mt-1">
        <p class="text-danger" [hidden]="!nome.errors['required']">
          Digite o nome.
        </p>
      </div>
    </div>
    <div class="mb-3">
      <label for="cpf" class="fs-paragraph">CPF</label>
        <input
        type="text"
        class="form-control p-25 border-dark"
        id="cpf"
        name="cpf"
        placeholder="Digite o CPF"
        [(ngModel)]="employee.cpf"
        [readonly]="edit"
        #cpf="ngModel"
        cpf
        mask="000.000.000-00"
        required
      />
      <div *ngIf="cpf.errors && (cpf.dirty || cpf.touched)" class="mt-1">
        <p class="text-danger" [hidden]="!cpf.errors['required']">
          Digite o CPF.
        </p>
        <p class="text-danger" [hidden]="!cpf.errors['cpf']">CPF inválido.</p>
      </div>
    </div>
    <div class="mb-3">
      <label for="email" class="fs-paragraph">E-mail</label>
      <input
        type="email"
        class="form-control p-25 border-dark"
        id="email"
        name="email"
        placeholder="Digite o e-mail"
        ngModel="{{ employee.email }}"
        #email="ngModel"
        email
        required
      />
      <div *ngIf="email.errors && (email.dirty || email.touched)" class="mt-1">
        <p class="text-danger" [hidden]="!email.errors['required']">
          Digite o email.
        </p>
        <p class="text-danger" [hidden]="!email.errors['email']">
          E-mail inválido.
        </p>
      </div>
    </div>
    <div class="mb-3">
      <label for="phone" class="fs-paragraph">Telefone</label>
      <input
        type="text"
        class="form-control p-25 border-dark"
        id="phone"
        name="telefone"
        placeholder="Digite o telefone"
        mask="(00) 0000-0000 || (00) 0 0000-0000"
        ngModel="{{ employee.telefone }}"
        #telefone="ngModel"
        phone
        required
      />
      <div *ngIf="telefone.errors && (telefone.dirty || telefone.touched)" class="mt-1">
        <p class="text-danger" [hidden]="!telefone.errors['required']">
          Digite seu telefone.
        </p>
        <p class="text-danger" [hidden]="!telefone.errors['phone']">
          Telefone inválido.
        </p>
      </div>
    </div>
    <button
      type="submit"
      class="btn btn-primary text-light w-100"
      [disabled]="!editOrCreateForm.form.valid"
    >
      Enviar
    </button>
  </form>
</div>
